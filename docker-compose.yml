name: catalogue

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: "1"
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "Catalogue <no-reply@catalogue.local>"
      SALES_INBOX: sales@catalogue.local
    volumes:
      - ./apps/api/data:/app/apps/api/data:ro
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
